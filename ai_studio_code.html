<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Frontend Prompt Manager Workbench</title>
  <meta name="description" content="A client-side prompt management workbench with dynamic variable parsing, version history, and sequential chaining workflows.">
  <meta property="og:title" content="Static Frontend Prompt Manager Workbench">
  <meta property="og:description" content="A client-side prompt management workbench with dynamic variable parsing, version history, and sequential chaining workflows.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500/30 selection:text-brand-200">
  <div id="app" x-data="promptManagerApp()" x-init="initApp()" class="flex flex-col h-screen overflow-hidden">
    <!-- Top Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between z-20 shrink-0">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-indigo-500 to-brand-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i data-lucide="terminal" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-white flex items-center gap-2">
            PromptCraft Workbench
            <span class="text-[10px] px-1.5 py-0.5 rounded font-mono font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Client-Side v2.1</span>
          </h1>
          <p class="text-[11px] text-slate-400">Zero backend • LocalStorage Engine • Chaining Engine</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800">
        <button 
          @click="activeTab = 'editor'; renderIcons()" 
          :class="activeTab === 'editor' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
          class="flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>Prompt Editor</span>
        </button>
        <button 
          @click="activeTab = 'chaining'; renderIcons()" 
          :class="activeTab === 'chaining' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
          class="flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all">
          <i data-lucide="workflow" class="w-3.5 h-3.5"></i>
          <span>Chaining Workflow</span>
          <span x-show="chainSteps.length > 0" x-text="chainSteps.length" class="text-[10px] bg-indigo-800 px-1.5 rounded-full"></span>
        </button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2">
        <button 
          @click="exportJson()" 
          title="Export Prompts as JSON" 
          class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          <i data-lucide="download" class="w-3.5 h-3.5 text-slate-400"></i>
          <span class="hidden sm:inline">Export</span>
        </button>
        
        <label 
          title="Import Prompts from JSON" 
          class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition cursor-pointer">
          <i data-lucide="upload" class="w-3.5 h-3.5 text-slate-400"></i>
          <span class="hidden sm:inline">Import</span>
          <input type="file" accept=".json" class="hidden" @change="importJson($event)">
        </label>

        <button 
          @click="createNewPrompt()" 
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/20 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>New Prompt</span>
        </button>
      </div>
    </header>

    <!-- Notification Toast -->
    <div 
      x-show="toast.show" 
      x-transition 
      class="fixed bottom-5 right-5 z-50 flex items-center gap-2 px-4 py-2.5 rounded-lg shadow-xl border text-xs font-medium"
      :class="toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800' : 'bg-rose-950/90 text-rose-200 border-rose-800'"
      x-cloak>
      <i :data-lucide="toast.type === 'success' ? 'check-circle' : 'alert-circle'" class="w-4 h-4"></i>
      <span x-text="toast.message"></span>
    </div>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 flex overflow-hidden">
      
      <!-- TAB 1: PROMPT EDITOR -->
      <section x-show="activeTab === 'editor'" class="flex-1 flex w-full h-full overflow-hidden">
        <!-- Left Sidebar: Prompt Library -->
        <aside class="w-72 border-r border-slate-800 bg-slate-900/60 flex flex-col shrink-0">
          <div class="p-3 border-b border-slate-800 flex flex-col gap-2">
            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
              <input 
                type="text" 
                x-model="searchQuery" 
                placeholder="Search templates or tags..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-md pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>
            
            <!-- Tag Filter Pills -->
            <div class="flex items-center gap-1 overflow-x-auto pb-1 text-[11px] scrollbar-none" x-show="allTags.length > 0">
              <button 
                @click="selectedTag = ''" 
                :class="selectedTag === '' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
                class="px-2 py-0.5 rounded-full whitespace-nowrap transition">
                All
              </button>
              <template x-for="tag in allTags" :key="tag">
                <button 
                  @click="selectedTag = (selectedTag === tag ? '' : tag)" 
                  :class="selectedTag === tag ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
                  class="px-2 py-0.5 rounded-full whitespace-nowrap transition"
                  x-text="'#' + tag">
                </button>
              </template>
            </div>
          </div>

          <!-- Prompts List -->
          <div class="flex-1 overflow-y-auto divide-y divide-slate-800/60">
            <template x-for="prompt in filteredPrompts" :key="prompt.id">
              <div 
                @click="selectPrompt(prompt.id)"
                :class="selectedPromptId === prompt.id ? 'bg-indigo-950/40 border-l-2 border-indigo-500' : 'hover:bg-slate-800/40'"
                class="p-3 cursor-pointer transition flex flex-col gap-1.5 group">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-xs font-medium text-slate-200 group-hover:text-indigo-300 transition line-clamp-1" x-text="prompt.title || 'Untitled Prompt'"></h3>
                  <span class="text-[10px] text-slate-500 font-mono shrink-0" x-text="prompt.versions ? prompt.versions.length + 'v' : '1v'"></span>
                </div>
                <p class="text-[11px] text-slate-400 line-clamp-2 font-mono leading-relaxed" x-text="prompt.template || 'No template content...'"></p>
                <div class="flex items-center justify-between pt-1">
                  <div class="flex flex-wrap gap-1">
                    <template x-for="tag in prompt.tags" :key="tag">
                      <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 border border-slate-700/50" x-text="'#' + tag"></span>
                    </template>
                  </div>
                  <div class="flex items-center gap-1.5 text-[10px] text-indigo-400">
                    <span x-text="getVariableNames(prompt.template).length + ' vars'"></span>
                  </div>
                </div>
              </div>
            </template>

            <div x-show="filteredPrompts.length === 0" class="p-8 text-center text-xs text-slate-500">
              No matching prompts found.
            </div>
          </div>

          <!-- Library Footer Summary -->
          <div class="p-2.5 border-t border-slate-800 bg-slate-950/80 text-[11px] text-slate-400 flex items-center justify-between">
            <span x-text="prompts.length + ' Saved Prompts'"></span>
            <button @click="resetToDefaults()" class="hover:text-indigo-400 underline decoration-slate-600 transition">Reset Demo</button>
          </div>
        </aside>

        <!-- Center & Right: Editor, Parser, & Live Preview -->
        <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden bg-slate-950" x-show="currentPrompt">
          
          <!-- Middle Column: Prompt Template Editor -->
          <div class="flex-1 flex flex-col border-r border-slate-800 h-full overflow-hidden">
            <!-- Editor Subheader -->
            <div class="p-3 border-b border-slate-800 bg-slate-900/40 flex items-center justify-between gap-3">
              <div class="flex-1 flex items-center gap-2">
                <input 
                  type="text" 
                  x-model="currentPrompt.title" 
                  @input="autoSaveCurrentPrompt()"
                  placeholder="Prompt Title..." 
                  class="bg-transparent text-sm font-semibold text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded px-1.5 py-1 w-full border border-transparent hover:border-slate-800 transition">
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <!-- Tag Input Badge Container -->
                <div class="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded border border-slate-800">
                  <i data-lucide="tag" class="w-3 h-3 text-slate-500"></i>
                  <input 
                    type="text" 
                    placeholder="Add tags (comma separated)..." 
                    :value="(currentPrompt.tags || []).join(', ')"
                    @change="updateTags($event.target.value)"
                    class="bg-transparent text-xs text-slate-300 placeholder-slate-600 focus:outline-none w-36">
                </div>

                <!-- Version History Trigger -->
                <button 
                  @click="showVersionHistory = true; renderIcons()" 
                  title="Open Version History" 
                  class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                  <i data-lucide="history" class="w-3.5 h-3.5 text-indigo-400"></i>
                  <span>Versions (<span x-text="(currentPrompt.versions || []).length"></span>)</span>
                </button>

                <!-- Duplicate Button -->
                <button 
                  @click="duplicatePrompt(currentPrompt.id)" 
                  title="Duplicate Prompt" 
                  class="p-1.5 rounded hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition">
                  <i data-lucide="copy" class="w-4 h-4"></i>
                </button>

                <!-- Delete Button -->
                <button 
                  @click="deletePrompt(currentPrompt.id)" 
                  title="Delete Prompt" 
                  class="p-1.5 rounded hover:bg-rose-950/60 text-slate-400 hover:text-rose-400 transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Editor Info Bar -->
            <div class="px-4 py-2 bg-slate-900/20 border-b border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
              <div class="flex items-center gap-3">
                <span class="flex items-center gap-1">
                  <i data-lucide="code" class="w-3 h-3 text-indigo-400"></i>
                  Syntax: <code class="text-indigo-300 font-mono bg-indigo-950/40 px-1 rounded">{{variable}}</code>
                </span>
                <span class="text-slate-600">|</span>
                <span x-text="currentVariables.length + ' dynamic ' + (currentVariables.length === 1 ? 'variable' : 'variables') + ' detected'"></span>
              </div>
              <div class="flex items-center gap-3 font-mono">
                <span x-text="(currentPrompt.template ? currentPrompt.template.length : 0) + ' chars'"></span>
                <span x-text="'~' + Math.ceil((currentPrompt.template ? currentPrompt.template.length : 0) / 4) + ' tokens'"></span>
              </div>
            </div>

            <!-- Template Textarea -->
            <div class="flex-1 p-4 flex flex-col relative">
              <textarea 
                x-model="currentPrompt.template" 
                @input="handleTemplateInput()"
                placeholder="Write your prompt template here... Use {{variable_name}} for dynamic slots, e.g.:

Act as a {{role}}. Review the following {{language}} code:
